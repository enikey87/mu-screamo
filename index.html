<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Битва с Быничем</title>
    <meta
      name="description"
      content="Мычи, пока Бынич набирает воздух. Крик не считается."
    />
    <meta name="theme-color" content="#2f8fe3" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='36' r='22' fill='%23c98a5b'/><ellipse cx='16' cy='18' rx='8' ry='4' fill='%23f0e0c4' transform='rotate(-30 16 18)'/><ellipse cx='48' cy='18' rx='8' ry='4' fill='%23f0e0c4' transform='rotate(30 48 18)'/><circle cx='24' cy='34' r='4' fill='%2385c6ec'/><circle cx='40' cy='34' r='4' fill='%2385c6ec'/></svg>" />
  </head>
  <body style="background-image: url('./art/meadow.webp')">
    <main class="app" id="app">
      <div class="clock" aria-hidden="true"><span id="clock"></span></div>
      <p class="eyebrow" id="date-label"></p>
      <h1 class="callout" id="callout">Кто кого</h1>
      <div class="gauge" aria-hidden="true">
        <div class="gauge__track"><span class="gauge__you"></span></div>
        <span class="gauge__mark"></span>
      </div>
      <div class="arena">
        <div class="fighter fighter--you" id="fighter-you">
          <div class="fighter__body">
            <div class="bull" id="you-bull">
              <img class="bull__face bull__face--calm" src="./art/bull-calm.webp" alt="" />
              <img class="bull__face bull__face--fierce" src="./art/bull-fierce.webp" alt="" />
              <img class="bull__face bull__face--pleased" src="./art/bull-pleased.webp" alt="" />
              <img class="bull__face bull__face--puzzled" src="./art/bull-puzzled.webp" alt="" />
            </div>
          </div>
          <span class="fighter__name">Ты</span>
        </div>
        <div class="fighter fighter--bull" id="fighter-bull">
          <div class="fighter__body">
            <div class="bull" id="bull-bull">
              <img class="bull__face bull__face--calm" src="./art/bull-calm.webp" alt="" />
              <img class="bull__face bull__face--fierce" src="./art/bull-fierce.webp" alt="" />
              <img class="bull__face bull__face--pleased" src="./art/bull-pleased.webp" alt="" />
              <img class="bull__face bull__face--puzzled" src="./art/bull-puzzled.webp" alt="" />
            </div>
          </div>
          <span class="fighter__name">Бынич</span>
        </div>
      </div>
      <div class="flash" aria-hidden="true"></div>
      <div class="dock">
        <button class="go" id="go" type="button">В бой</button>
        <p class="hint" id="hint">Мычи, пока Бынич набирает воздух. Крик не считается.</p>
        <p class="privacy">Микрофон только на время раунда. Запись не ведётся.</p>
      </div>
    </main>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
