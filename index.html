<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Битва с Быничем</title>
    <meta
      name="description"
      content="На лугу решают мычанием. Прими вызов Бынича и перетяни шкалу своим му-у-у."
    />
    <meta name="theme-color" content="#f6eece" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='36' r='22' fill='%23c98a5b'/><ellipse cx='16' cy='18' rx='8' ry='4' fill='%23f0e0c4' transform='rotate(-30 16 18)'/><ellipse cx='48' cy='18' rx='8' ry='4' fill='%23f0e0c4' transform='rotate(30 48 18)'/><circle cx='24' cy='34' r='4' fill='%2385c6ec'/><circle cx='40' cy='34' r='4' fill='%2385c6ec'/></svg>" />
  </head>
  <body>
    <main class="app" id="app" data-mode="daily" aria-label="Битва с Быничем">
      <header class="sheet">
        <nav class="mode-nav" aria-label="Режим игры">
          <button type="button" data-mode="daily" aria-pressed="true">Дуэль дня</button>
          <button type="button" data-mode="championship" aria-pressed="false">Чемпионат луга</button>
        </nav>
        <p class="edition sr-only" id="edition-label" hidden></p>
        <nav class="stage-path" id="stage-path" aria-label="Встречи чемпионата" hidden>
          <button class="stage-step" type="button" data-stage="0">1</button>
          <button class="stage-step" type="button" data-stage="1">2</button>
          <button class="stage-step" type="button" data-stage="2">3</button>
          <button class="stage-step" type="button" data-stage="3">4</button>
          <button class="stage-step" type="button" data-stage="4">5</button>
        </nav>

      </header>
      <div class="arena" aria-label="Ты против Бынича">
        <h1 class="callout" id="callout"><span id="callout-label">Ну что,<br />кто кого?</span></h1>
        <div class="coin-toss" id="coin-toss" hidden aria-hidden="true">
          <div class="coin__spin">
            <span class="coin__face coin__face--you">Ты</span>
            <span class="coin__face coin__face--bull">Бынич</span>
          </div>
        </div>
        <div class="fighter fighter--you" id="fighter-you">
          <div class="fighter-status">
            <span class="fighter__name">Ты</span>
            <span class="player-window" id="player-window" hidden>
              <span id="player-time"></span>
              <span class="player-window__track" id="player-meter" role="progressbar" aria-label="Осталось мычать" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="player-fill"></span></span>
            </span>
          </div>
          <div class="fighter__body">
            <div class="bull" id="you-bull">
              <img class="bull__face bull__face--calm" src="./art/bull-calm.webp" alt="" />
              <img class="bull__face bull__face--fierce" src="./art/bull-fierce.webp" alt="" />
              <img class="bull__face bull__face--pleased" src="./art/bull-pleased.webp" alt="" />
              <img class="bull__face bull__face--puzzled" src="./art/bull-puzzled.webp" alt="" />
            </div>
          </div>
        </div>
        <div class="fighter fighter--bull" id="fighter-bull">
          <div class="fighter-status">
            <span class="fighter__name" id="bull-name">Бынич</span>
            <span class="bull-window" id="bull-window" hidden>
              <span id="bull-action" class="sr-only"></span><span id="bull-time"></span>
              <span class="bull-window__track" id="bull-meter" role="progressbar" aria-label="Вдох Бынича до следующего му" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bull-fill"></span></span>
            </span>
          </div>
          <div class="fighter__body">
            <div class="bull" id="bull-bull">
              <span class="bull__championship" aria-hidden="true"></span>
              <img class="bull__face bull__face--calm" src="./art/bull-calm.webp" alt="" />
              <img class="bull__face bull__face--fierce" src="./art/bull-fierce.webp" alt="" />
              <img class="bull__face bull__face--pleased" src="./art/bull-pleased.webp" alt="" />
              <img class="bull__face bull__face--puzzled" src="./art/bull-puzzled.webp" alt="" />
            </div>
            <span class="breath-cue" id="breath-cue">
              <svg viewBox="0 0 80 50" fill="none" aria-hidden="true">
                <g class="breath-cue__flow"><path d="M3 8C27 2 35 20 66 16M3 25H72M3 42C27 48 35 30 66 34" /></g>
                <path d="M62 11L69 16L62 20M67 20L74 25L67 30M62 30L69 34L62 39" />
              </svg>
            </span>
          </div>
        </div>
      </div>
      <div class="scoreboard" id="scoreboard" hidden>
        <strong id="advantage" class="sr-only">Равные силы</strong>
        <div class="gauge" role="meter" aria-label="Перетягивание шкалы" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
          <div class="gauge__track"><span class="gauge__you"></span></div>
          <span class="gauge__center" aria-hidden="true"></span>
          <span class="gauge__mark" aria-hidden="true"></span>
        </div>
        <div class="clock" aria-hidden="true"><span id="clock"></span></div>
      </div>
      <div class="air sr-only" id="air" hidden>
        <div class="air__label"><span>Твой воздух</span><span id="air-label">Молчишь — восстанавливаешь</span></div>
        <div class="air__track" role="meter" aria-label="Запас воздуха" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="air-fill"></span></div>
      </div>
      <span class="champion-seal" id="champion-seal" hidden>Чемпион<br />луга</span>
      <div class="flash" aria-hidden="true"></div>
      <footer class="dock">
        <p class="sr-only" id="hint" role="status">Тяни «му-у-у», пока Бынич вдыхает.<br />Перетяни шкалу на свою сторону.</p>
        <button class="go" id="go" type="button">Принять вызов <span aria-hidden="true">↗</span></button>
        <p class="privacy" id="privacy"></p>
        <p class="save-notice" id="save-notice" role="status" hidden>Браузер не сохранил прогресс. Он останется до закрытия страницы.</p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
