<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Битва с Быничем</title>
    <meta
      name="description"
      content="Две секунды можно орать. Дальше Бынич записывает в протокол только мууу."
    />
    <meta name="theme-color" content="#d7eef8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='36' r='22' fill='%23c98a5b'/><ellipse cx='16' cy='18' rx='8' ry='4' fill='%23f0e0c4' transform='rotate(-30 16 18)'/><ellipse cx='48' cy='18' rx='8' ry='4' fill='%23f0e0c4' transform='rotate(30 48 18)'/><circle cx='24' cy='34' r='4' fill='%2385c6ec'/><circle cx='40' cy='34' r='4' fill='%2385c6ec'/></svg>" />
  </head>
  <body>
    <main class="app" id="app">
      <div class="clock" aria-hidden="true"><span id="clock"></span></div>
      <p class="eyebrow" id="date-label"></p>
      <h1 class="callout" id="callout">Тяни</h1>
      <div class="gauge" aria-hidden="true">
        <span class="gauge__you"></span>
        <span class="gauge__mark"></span>
      </div>
      <div class="arena">
        <div class="fighter fighter--you" id="fighter-you">
          <div class="fighter__body" id="you-body"></div>
          <span class="fighter__name">Ты</span>
        </div>
        <div class="fighter fighter--bull" id="fighter-bull">
          <div class="fighter__body" id="bull-body"></div>
          <span class="fighter__name">Бынич</span>
        </div>
      </div>
      <div class="flash" aria-hidden="true"></div>
      <p class="paper" id="line" aria-live="polite"></p>
      <button class="go" id="go" type="button">В бой</button>
      <p class="hint" id="hint">Мычи в его вдох. Крик шкалу не двигает.</p>
      <p class="privacy">Микрофон включён только на время раунда. Ничего не записывается и не отправляется.</p>
    </main>

    <dialog class="card-dialog" id="card-dialog">
      <canvas id="card" width="1080" height="1920"></canvas>
      <div class="card-actions">
        <button id="save" type="button">Сохранить картинку</button>
        <button id="copy" class="ghost" type="button">Скопировать строку</button>
        <button id="again" class="ghost" type="button">Ещё раз</button>
      </div>
    </dialog>

    <template id="bull-tpl">
      <svg class="bull" viewBox="0 0 420 470" role="img">
        <g class="bull-body">
          <path d="M320 268 Q 372 280 362 344" fill="none" stroke="#a5714a" stroke-width="13" stroke-linecap="round" />
          <ellipse cx="361" cy="354" rx="14" ry="19" fill="#6b3e22" transform="rotate(-10 361 354)" />
          <g fill="#b0763f" stroke="#8a5a32" stroke-width="5">
            <rect x="243" y="350" width="30" height="100" rx="13" />
            <rect x="283" y="350" width="30" height="100" rx="13" />
          </g>
          <g fill="#6b3e22">
            <rect x="243" y="424" width="30" height="26" rx="9" />
            <rect x="283" y="424" width="30" height="26" rx="9" />
          </g>
          <ellipse cx="212" cy="320" rx="122" ry="98" fill="#c98a5b" stroke="#8a5a32" stroke-width="5" />
          <g fill="#c98a5b" stroke="#8a5a32" stroke-width="5">
            <rect x="137" y="350" width="30" height="100" rx="13" />
            <rect x="177" y="350" width="30" height="100" rx="13" />
          </g>
          <g fill="#6b3e22">
            <rect x="137" y="424" width="30" height="26" rx="9" />
            <rect x="177" y="424" width="30" height="26" rx="9" />
          </g>
          <rect class="collar" x="126" y="286" width="172" height="26" rx="13" fill="#d9534f" stroke="#a63a36" stroke-width="4" />
          <circle cx="212" cy="322" r="16" fill="#f7c948" stroke="#c9982a" stroke-width="4" />
        </g>
        <g class="head">
          <path d="M150 84 Q 126 34 92 22 Q 130 24 154 56 Q 162 70 150 84 Z" fill="#f0e0c4" stroke="#c9a96e" stroke-width="4" />
          <path d="M270 84 Q 294 34 328 22 Q 290 24 266 56 Q 258 70 270 84 Z" fill="#f0e0c4" stroke="#c9a96e" stroke-width="4" />
          <ellipse cx="212" cy="172" rx="106" ry="114" fill="#c98a5b" stroke="#8a5a32" stroke-width="5" />
          <g class="brows">
            <path d="M146 138 Q 168 126 190 136" fill="none" stroke="#8a5a32" stroke-width="5" stroke-linecap="round" />
            <path d="M234 136 Q 256 126 278 138" fill="none" stroke="#8a5a32" stroke-width="5" stroke-linecap="round" />
          </g>
          <g class="eye">
            <ellipse cx="168" cy="168" rx="21" ry="26" fill="#fff" stroke="#8a5a32" stroke-width="3.5" />
            <g class="pupil">
              <circle cx="168" cy="171" r="13.5" fill="#85c6ec" />
              <circle cx="168" cy="171" r="9.5" fill="#3b2314" />
              <circle cx="172" cy="166" r="3" fill="#fff" />
            </g>
          </g>
          <g class="eye">
            <ellipse cx="256" cy="168" rx="21" ry="26" fill="#fff" stroke="#8a5a32" stroke-width="3.5" />
            <g class="pupil">
              <circle cx="256" cy="171" r="13.5" fill="#85c6ec" />
              <circle cx="256" cy="171" r="9.5" fill="#3b2314" />
              <circle cx="260" cy="166" r="3" fill="#fff" />
            </g>
          </g>
          <path class="eye-arc" d="M150 176 Q 168 158 186 176" fill="none" stroke="#3b2314" stroke-width="5" stroke-linecap="round" />
          <path class="eye-arc" d="M238 176 Q 256 158 274 176" fill="none" stroke="#3b2314" stroke-width="5" stroke-linecap="round" />
          <g class="muzzle">
            <ellipse cx="212" cy="250" rx="70" ry="48" fill="#ecc6a3" stroke="#c9987a" stroke-width="4" />
            <ellipse cx="184" cy="238" rx="8" ry="12" fill="#8a5a32" />
            <ellipse cx="240" cy="238" rx="8" ry="12" fill="#8a5a32" />
            <ellipse class="mouth-calm" cx="212" cy="270" rx="14" ry="6" fill="#7a4030" />
            <ellipse class="mouth-fierce" cx="212" cy="276" rx="30" ry="22" fill="#5c241c" />
            <ellipse class="mouth-fierce" cx="212" cy="284" rx="16" ry="8" fill="#e5837b" />
          </g>
        </g>
      </svg>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
